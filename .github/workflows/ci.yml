name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          # Проверяется при сборке (CLIENT_ENV); на Vercel — настоящий адрес
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
